name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (universal)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-universal-release.apk

      - name: Build arm64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-arm64-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-md3-apk
          path: |
            /tmp/app-universal-release.apk
            /tmp/app-arm64-release.apk
          retention-days: 30

      - name: Generate version tag
        id: version
        run: |
          TAG="v3.26.7-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Delete old prereleases
        run: |
          echo "Deleting old prereleases..."
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" > /tmp/releases.json
          python3 << 'PYEOF'
import json, urllib.request, os
token = os.environ.get('GITHUB_TOKEN', '')
repo = os.environ.get('GITHUB_REPOSITORY', '')
with open('/tmp/releases.json') as f:
    releases = json.load(f)
for r in releases:
    if r.get('prerelease'):
        rid = r['id']
        tag = r['tag_name']
        print(f'Deleting prerelease: {tag} (id: {rid})')
        # Delete release
        req = urllib.request.Request(
            f'https://api.github.com/repos/{repo}/releases/{rid}',
            method='DELETE',
            headers={'Authorization': f'token {token}', 'User-Agent': 'GitHub Actions'}
        )
        try:
            urllib.request.urlopen(req)
            print(f'  Deleted release {rid}')
        except Exception as e:
            print(f'  Error: {e}')
        # Delete tag
        req2 = urllib.request.Request(
            f'https://api.github.com/repos/{repo}/git/refs/tags/{tag}',
            method='DELETE',
            headers={'Authorization': f'token {token}', 'User-Agent': 'GitHub Actions'}
        )
        try:
            urllib.request.urlopen(req2)
            print(f'  Deleted tag {tag}')
        except Exception as e:
            print(f'  Error: {e}')
PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Prerelease
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Legado MD3 ${{ steps.version.outputs.tag }} (预发布)"
          body: |
            ## Legado MD3 自动构建
            
            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
            
            ### 下载
            - `app-universal-release.apk` - 通用版（支持所有架构）
            - `app-arm64-release.apk` - arm64专用版（更小）
            
            > 此为自动构建的预发布版本。
          prerelease: true
          files: |
            /tmp/app-universal-release.apk
            /tmp/app-arm64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
