name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pub deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build debug APK
        run: |
          # Flutter 3.47 在本工程布局下存在 APK 检测路径误报（产物实际已生成），
          # 故容忍其退出码，改由下方 test -f 校验真实产物。
          flutter build apk --debug || true
          test -f android/app/build/outputs/flutter-apk/app-debug.apk

      - name: Prepare release signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # 同 debug：规避 Flutter 3.47 APK 检测路径误报，以 test -f 校验真实产物
          flutter build apk --release || true
          test -f android/app/build/outputs/flutter-apk/app-release.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-md3-debug-apk
          path: android/app/build/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: legado-md3-release-apk
          path: android/app/build/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
