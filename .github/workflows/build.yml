name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pub deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build debug APK
        run: |
          flutter build apk --debug || true
          echo "===== APK 搜索 ====="
          find . -name "*.apk" -not -path "*/.dart_tool/*" 2>/dev/null || echo "未找到任何 apk"
          echo "===== android/app/build 目录树（深度3）====="
          if [ -d android/app/build ]; then find android/app/build -maxdepth 3 | head -60; else echo "android/app/build 不存在"; fi
          echo "===== repo根 build 目录树（深度3）====="
          if [ -d build ]; then find build -maxdepth 3 | head -60; else echo "repo根 build 不存在"; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-md3-debug-apk
          path: android/app/build/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
